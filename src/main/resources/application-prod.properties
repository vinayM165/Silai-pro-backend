# Supabase PostgreSQL - Production Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.akfrksoevcqupncevqzu.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:placeholder_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Do NOT run schema.sql in prod (JPA handles table creation via entities)
spring.sql.init.mode=never

# JWT Secret
jwt.secret=${JWT_SECRET:SilaiProDefaultSecretKeyForInitialDeploymentOnly}
